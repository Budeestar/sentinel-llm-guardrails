[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel-llm-guardrails"
version = "0.4.0"
description = "Hardened OWASP LLM Top 10 guardrails: evasion-resistant injection checks, a stdlib-only learned prompt-injection classifier, secret redaction, rate limits, latency budgets and per-tenant audit trails. Stdlib only."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Budeestar" }]
keywords = ["llm", "guardrails", "owasp", "prompt-injection", "pii", "security"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
sentinel-llm-guardrails = "sentinel_llm_guardrails.__main__:main"

[project.urls]
Homepage = "https://github.com/Budeestar/sentinel-llm-guardrails"
Issues = "https://github.com/Budeestar/sentinel-llm-guardrails/issues"
Repository = "https://github.com/Budeestar/sentinel-llm-guardrails"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sentinel_llm_guardrails = ["models/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
